
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerdulStock Elite</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0f1115;
color:white;
}

.hidden{
display:none!important;
}

.login{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:#151922;
border:1px solid #242c38;
padding:34px;
border-radius:24px;
}

.logo{
font-size:34px;
font-weight:700;
color:#9BE15D;
text-align:center;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#98a2b3;
margin-bottom:24px;
}

.input{
width:100%;
height:52px;
background:#101318;
border:1px solid #2b3444;
border-radius:14px;
padding:0 16px;
color:white;
margin-bottom:14px;
font-size:15px;
}

.btn{
width:100%;
height:54px;
border:none;
border-radius:16px;
background:#6dbd39;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:250px;
background:#151922;
border-right:1px solid #242c38;
padding:22px;
display:flex;
flex-direction:column;
gap:12px;
}

.nav-btn{
background:#1d2330;
border:1px solid #2b3444;
padding:14px;
border-radius:14px;
color:white;
cursor:pointer;
text-align:left;
}

.nav-btn.active{
background:#2f6418;
border-color:#6dbd39;
}

.logout{
margin-top:auto;
background:#5a1f1f;
border:none;
padding:14px;
border-radius:14px;
color:white;
cursor:pointer;
}

.main{
flex:1;
padding:28px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
flex-wrap:wrap;
gap:10px;
}

.title{
font-size:30px;
font-weight:700;
}

.user{
background:#1d2330;
padding:12px 16px;
border-radius:14px;
border:1px solid #2b3444;
}

.panel{
background:#151922;
border:1px solid #242c38;
border-radius:20px;
padding:24px;
margin-bottom:20px;
}

.product{
background:#1d2330;
border:1px solid #2b3444;
padding:18px;
border-radius:16px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
flex-wrap:wrap;
gap:10px;
}

.product-name{
font-size:18px;
font-weight:600;
}

.product-info{
font-size:13px;
color:#98a2b3;
margin-top:4px;
}

.controls{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.ctrl-btn{
width:40px;
height:40px;
border:none;
border-radius:12px;
background:#2f6418;
color:white;
font-size:20px;
cursor:pointer;
}

.qty{
width:70px;
height:42px;
background:#101318;
border:1px solid #303848;
border-radius:12px;
color:white;
text-align:center;
font-size:16px;
}

.save{
margin-top:20px;
width:100%;
height:54px;
border:none;
border-radius:16px;
background:#6dbd39;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.table{
margin-top:20px;
}

.row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr 1fr;
gap:10px;
padding:14px;
background:#1d2330;
border:1px solid #2b3444;
border-radius:14px;
margin-bottom:10px;
align-items:center;
}

.small-btn{
background:#2f6418;
border:none;
padding:10px 14px;
border-radius:12px;
color:white;
cursor:pointer;
margin-right:10px;
margin-top:10px;
}

.delete-btn{
background:#5a1f1f;
border:none;
padding:10px 14px;
border-radius:12px;
color:white;
cursor:pointer;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-top:20px;
}

.copy-box{
background:#101318;
border:1px solid #2b3444;
padding:16px;
border-radius:14px;
margin-top:20px;
white-space:pre-line;
}

@media(max-width:850px){

.app{
flex-direction:column;
}

.sidebar{
width:100%;
overflow:auto;
}

.main{
padding:18px;
}

.row{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div id="loginPage" class="login">

<div class="login-box">

<div class="logo">🥬 VerdulStock</div>

<div class="sub">
Sistema inteligente para verdulerías
</div>

<input id="user" class="input" placeholder="Usuario">
<input id="pass" class="input" type="password" placeholder="Contraseña">

<button class="btn" onclick="login()">
Ingresar
</button>

</div>

</div>

<div id="app" class="app hidden">

<div class="sidebar">

<div class="logo">🥬 VerdulStock</div>

<button class="nav-btn active" onclick="showPage('stock', this)">
📦 Stock
</button>

<button id="pedidosBtn" class="nav-btn" onclick="showPage('pedidos', this)">
🛒 Pedidos
</button>

<button id="adminBtn" class="nav-btn" onclick="showPage('admin', this)">
⚙️ Admin
</button>

<button class="logout" onclick="logout()">
🚪 Salir
</button>

</div>

<div class="main">

<div class="top">

<div>
<div class="title" id="title">
Nemi 1
</div>

<div style="color:#98a2b3;margin-top:4px" id="roleText">
Empleado
</div>
</div>

<div class="user" id="userBox">
👤 Usuario
</div>

</div>

<div id="stockPage" class="panel">

<h2 style="margin-bottom:20px">
📦 Cargar stock
</h2>

<div id="products"></div>

<button class="save" onclick="saveAll()">
💾 Guardar cambios
</button>

</div>

<div id="pedidosPage" class="panel hidden">

<h2 style="margin-bottom:20px">
🛒 Pedido total al proveedor
</h2>

<div id="pedidoList"></div>

<button class="small-btn" onclick="copyPedido()">
📋 Copiar
</button>

<button class="small-btn" onclick="sendWhatsApp()">
📲 WhatsApp
</button>

<button class="small-btn" onclick="downloadPedido()">
📄 Descargar
</button>

<div id="pedidoText" class="copy-box hidden"></div>

</div>

<div id="adminPage" class="panel hidden">

<h2>
📊 Control total de sucursales
</h2>

<div id="stockGeneral" class="table"></div>

<h2 style="margin-top:30px">
👷 Empleados
</h2>

<div class="form-grid">

<input id="empUser" class="input" placeholder="Usuario">
<input id="empPass" class="input" placeholder="Contraseña">

<select id="empBranch" class="input">
<option value="0">Nemi 1</option>
<option value="1">Nemi 2</option>
<option value="2">Nemi 3</option>
</select>

</div>

<button class="save" onclick="addEmployee()">
➕ Agregar empleado
</button>

<div id="employeesList" class="table"></div>

<h2 style="margin-top:30px">
📦 Productos
</h2>

<div class="form-grid">

<input id="prodName" class="input" placeholder="Producto">

<select id="prodType" class="input">
<option value="cajones">Cajones</option>
<option value="bolsas">Bolsas</option>
<option value="paquetes">Paquetes</option>
<option value="unidades">Unidades</option>
</select>

<input id="ideal1" class="input" type="number" placeholder="Ideal N1">
<input id="ideal2" class="input" type="number" placeholder="Ideal N2">
<input id="ideal3" class="input" type="number" placeholder="Ideal N3">

</div>

<button class="save" onclick="addProduct()">
➕ Agregar producto
</button>

</div>

</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [
{user:"admin",pass:"1234",role:"admin"},
{user:"nemi1",pass:"1234",role:"empleado",branch:0},
{user:"nemi2",pass:"1234",role:"empleado",branch:1},
{user:"nemi3",pass:"1234",role:"empleado",branch:2},
];

let stockData = JSON.parse(localStorage.getItem("stockData")) || [
[
{name:"Tomates",ideal:10,current:3,unit:"cajones"},
{name:"Papas",ideal:12,current:8,unit:"paquetes"},
{name:"Bananas",ideal:7,current:2,unit:"cajones"},
],
[
{name:"Tomates",ideal:8,current:5,unit:"cajones"},
{name:"Papas",ideal:10,current:4,unit:"paquetes"},
{name:"Bananas",ideal:5,current:1,unit:"cajones"},
],
[
{name:"Tomates",ideal:7,current:2,unit:"cajones"},
{name:"Papas",ideal:9,current:7,unit:"paquetes"},
{name:"Bananas",ideal:4,current:1,unit:"cajones"},
]
];

const branches = ["Nemi 1","Nemi 2","Nemi 3"];

let currentUser = null;
let currentBranch = 0;

function saveAll(){

localStorage.setItem("users", JSON.stringify(users));
localStorage.setItem("stockData", JSON.stringify(stockData));

alert("✅ Todo guardado");

}

function login(){

const user = document.getElementById("user").value;
const pass = document.getElementById("pass").value;

const found = users.find(u =>
u.user === user &&
u.pass === pass
);

if(!found){
alert("Usuario incorrecto");
return;
}

currentUser = found;

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("userBox").innerText = "👤 " + found.user;

if(found.role === "admin"){

document.getElementById("roleText").innerText = "Administrador";

}else{

document.getElementById("roleText").innerText = "Empleado";

document.getElementById("pedidosBtn").classList.add("hidden");
document.getElementById("adminBtn").classList.add("hidden");

currentBranch = found.branch;

document.getElementById("title").innerText = branches[currentBranch];

}

renderProducts();
renderPedido();
renderAdmin();

}

function logout(){

document.getElementById("loginPage").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");

document.getElementById("pedidosBtn").classList.remove("hidden");
document.getElementById("adminBtn").classList.remove("hidden");

}

function renderProducts(){

const container = document.getElementById("products");

container.innerHTML = "";

stockData[currentBranch].forEach((p,index)=>{

container.innerHTML += `
<div class="product">

<div>
<div class="product-name">${p.name}</div>
<div class="product-info">
Actual: ${p.current} ${p.unit}
</div>
</div>

<div class="controls">

<button class="ctrl-btn" onclick="changeQty(${index}, -1)">-</button>

<input class="qty" value="${p.current}" readonly>

<button class="ctrl-btn" onclick="changeQty(${index}, 1)">+</button>

</div>

</div>
`;

});

}

function changeQty(index, amount){

stockData[currentBranch][index].current += amount;

if(stockData[currentBranch][index].current < 0){
stockData[currentBranch][index].current = 0;
}

renderProducts();
renderPedido();
renderAdmin();

}

function renderPedido(){

const pedidoList = document.getElementById("pedidoList");

pedidoList.innerHTML = "";

stockData[0].forEach((p,index)=>{

const faltante1 = stockData[0][index].ideal - stockData[0][index].current;
const faltante2 = stockData[1][index].ideal - stockData[1][index].current;
const faltante3 = stockData[2][index].ideal - stockData[2][index].current;

const total = Math.max(0,faltante1) + Math.max(0,faltante2) + Math.max(0,faltante3);

pedidoList.innerHTML += `
<div class="product">

<div>
<div class="product-name">
${p.name}
</div>

<div class="product-info">
N1: ${faltante1 > 0 ? faltante1 : 0} |
N2: ${faltante2 > 0 ? faltante2 : 0} |
N3: ${faltante3 > 0 ? faltante3 : 0}
</div>
</div>

<div class="controls">

<input class="qty" id="pedido-${index}" value="${total}">

<div style="color:#98a2b3">
${p.unit}
</div>

</div>

</div>
`;

});

}

function renderAdmin(){

const stockGeneral = document.getElementById("stockGeneral");

stockGeneral.innerHTML = "";

stockData[0].forEach((p,index)=>{

stockGeneral.innerHTML += `
<div class="row">

<div>${p.name}</div>

<div>
N1: ${stockData[0][index].current}/${stockData[0][index].ideal}
</div>

<div>
N2: ${stockData[1][index].current}/${stockData[1][index].ideal}
</div>

<div>
N3: ${stockData[2][index].current}/${stockData[2][index].ideal}
</div>

<div>
${p.unit}
</div>

</div>
`;

});

const employeesList = document.getElementById("employeesList");

employeesList.innerHTML = "";

users.filter(u => u.role === "empleado").forEach((u,index)=>{

employeesList.innerHTML += `
<div class="row">

<div>${u.user}</div>

<div>${u.pass}</div>

<div>${branches[u.branch]}</div>

<div></div>

<div>
<button class="delete-btn" onclick="deleteEmployee(${index})">
Eliminar
</button>
</div>

</div>
`;

});

}

function addEmployee(){

const user = document.getElementById("empUser").value;
const pass = document.getElementById("empPass").value;
const branch = parseInt(document.getElementById("empBranch").value);

if(!user || !pass){
alert("Completa datos");
return;
}

users.push({
user,
pass,
role:"empleado",
branch
});

saveAll();
renderAdmin();

}

function deleteEmployee(index){

const employees = users.filter(u => u.role === "empleado");

const emp = employees[index];

users = users.filter(u => u !== emp);

saveAll();
renderAdmin();

}

function addProduct(){

const name = document.getElementById("prodName").value;
const type = document.getElementById("prodType").value;

const i1 = parseInt(document.getElementById("ideal1").value);
const i2 = parseInt(document.getElementById("ideal2").value);
const i3 = parseInt(document.getElementById("ideal3").value);

if(!name || !i1 || !i2 || !i3){
alert("Completa todo");
return;
}

stockData[0].push({name,ideal:i1,current:0,unit:type});
stockData[1].push({name,ideal:i2,current:0,unit:type});
stockData[2].push({name,ideal:i3,current:0,unit:type});

saveAll();

renderProducts();
renderPedido();
renderAdmin();

}

function generatePedido(){

let text = "🛒 PEDIDO GENERAL\n\n";

stockData[0].forEach((p,index)=>{

const total = parseInt(document.getElementById("pedido-" + index).value);

if(total > 0){

text += `${p.name}: ${total} ${p.unit}\n`;

}

});

return text;

}

function copyPedido(){

const text = generatePedido();

navigator.clipboard.writeText(text);

const box = document.getElementById("pedidoText");

box.classList.remove("hidden");

box.innerText = text;

alert("✅ Pedido copiado");

}

function sendWhatsApp(){

const text = encodeURIComponent(generatePedido());

window.open(`https://wa.me/?text=${text}`);

}

function downloadPedido(){

const blob = new Blob([generatePedido()], {type:"text/plain"});

const a = document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "pedido.txt";

a.click();

}

function showPage(page, btn){

document.querySelectorAll(".nav-btn").forEach(b=>{
b.classList.remove("active");
});

btn.classList.add("active");

document.getElementById("stockPage").classList.add("hidden");
document.getElementById("pedidosPage").classList.add("hidden");
document.getElementById("adminPage").classList.add("hidden");

if(page === "stock"){
document.getElementById("stockPage").classList.remove("hidden");
}

if(page === "pedidos"){
document.getElementById("pedidosPage").classList.remove("hidden");
}

if(page === "admin"){
document.getElementById("adminPage").classList.remove("hidden");
}

}

</script>

</body>
</html>
